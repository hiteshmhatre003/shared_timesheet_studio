[project]
name = "shared_timesheet"
authors = [
    { name = "Amal Embroideries Private Limited" }
]
description = "Shared-device (kiosk) timesheet: many workers, one tablet, each punch protected by the worker's own PIN + photo."
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core>=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.dev-dependencies]

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<16.0.0"
